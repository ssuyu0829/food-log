name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 假的環境變數寫在 deno.json 的 task 裡（env.ts 載入時就會檢查）。
      # --frozen：deno.lock 跟程式對不上就直接失敗，不要在 CI 偷偷換版本。
      - name: Type check
        run: deno task --frozen check

      - name: Run tests
        run: deno task --frozen test
