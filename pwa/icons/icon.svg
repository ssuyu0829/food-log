<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#f4efe4"/>
  <!-- 帳本橫線 -->
  <g stroke="#ddd3c0" stroke-width="4">
    <line x1="0" y1="112" x2="512" y2="112"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="272" x2="512" y2="272"/>
    <line x1="0" y1="352" x2="512" y2="352"/>
    <line x1="0" y1="432" x2="512" y2="432"/>
  </g>
  <!-- 朱紅印章 -->
